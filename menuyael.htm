<!doctype html>
<html>
<meta charset="8">
<head>
	<title>Menu</title>
	<style>
	body{
	margin-bottom: 0;
	padding: 0;
	background-color: #F9E79F ;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 700px;
	}
	.menu{
	text-align: center;
	gap:20px;
	padding: 0 20px;
	justify-content: center;

	}	
	h1{
	text-align: center;
	color: #CC9900;
	font-size: 40px;
	font-family: monospace;
	text-transform: uppercase;
	margin-bottom: 25px;
	letter-spacing: 10px;
	}
	.contenedor{
	display: flex;
	justify-content: center;
	gap: 20px;
	margin: 0px;
	}
	.contenedor1{
    width: 200px;
    height: 300px;
       border: 3px solid black;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:0;
    box-sizing: border-box;
    background-color: rosybrown;
    flex-direction: column;

	}
	.h2{
	text-decoration: underline;
	font-size: 15px;
	font-family: serif;
	display: flex;
	height: 100%;

	}
	.img{
	width: 150px;
	height: 120px;
	object-fit: contain;
	margin-bottom: 15px;
	border-radius: 20%;
	}
	p{
	font-size: 25px;
	font-family: sans-serif;
	text-decoration: underline;
	color: green;
	}
	.in{
	height: 50px;
	width: 100px;
	background-color: saddlebrown;
	color:white;
	font-size: 20px;
	margin-top: auto;
	}
	.msj{
	display: flex;
	align-items: center;
	gap: 12px;
	margin-top: 20px;
	justify-content: center;
	}
	.btn{
	background-color: #996600;
	border-radius: 30%;
	height: 50px;
	width: 100px;
	color: whitesmoke;
	}


	</style>
</head>
<body>
	<div class="menu">
		<h1>Menu</h1>
		<div class="contenedor">
			<div class="contenedor1">
				<h2 class="titul">Concha</h2>
				<img src="img\conccha.png" class="img">
				<p>$12</p>
				<input type="number" id="con" class="in">
			</div>

			<div class="contenedor1">
				<h2 class="titul">Oreja</h2>
				<img src="img\ore.jpg" class="img">
				<p>$14</p>
				<input type="number" id="or" class="in">
			</div>

			<div class="contenedor1">
				<h2 class="titul">Dona</h2>
				<img src="img\don.jpg" class="img">
				<p>$10</p>
				<input type="number" id="don" class="in">
			</div>

			<div class="contenedor1">
				<h2 class="titul">Cuernito</h2>
				<img src="img\cue.jpg" class="img">
				<p>$15</p>
				<input type="number" id="cuer" class="in">
			</div>

			<div class="contenedor1">
				<h2 class="titul">Pastel</h2>
				<img src="img\pas.jpg" class="img">
				<p>$400</p>
				<input type="number" id="pas" class="in">
			</div>

			<div class="contenedor1">
				<h2 class="titul">Gelatina</h2>
				<img src="img\flan.jpg" class="img">
				<p>$150</p>
				<input type="number" id="gel" class="in">
			</div>

			<div class="contenedor1">
				<h2 class="titul">Panque</h2>
				<img src="img\pan.jpg"class="img">
				<p>$15</p>
				<input type="number" id="pan" class="in">
				
				
			
	</div>
</div>
			
			
			<div class="msj">
  <button type="submit" id="comprar" class="btn">COMPRAR</button>
  
  
  <a href="index.html"><button type="btn" class="btn">REGRESAR</button></a>

  <p id="res"> </p>
</div>

</div>
	<script>
const boton=document.getElementById("comprar");
boton.addEventListener("click",() =>{

	const precioa=Number(document.getElementById("con").value);
	const preciob=Number(document.getElementById("or").value);
	const precioc=Number(document.getElementById("don").value);
	const preciod=Number(document.getElementById("cuer").value);
	const precioe=Number(document.getElementById("pas").value);
	const preciof=Number(document.getElementById("gel").value);
	const precioag=Number(document.getElementById("pan").value);

	const p1=12;
	const p2=14;
	const p3=10;
	const p4=15;
	const p5=400;
	const p6=150;
	const p7=15;

	const pa= precioa*p1;
	const pb= preciob*p2;
	const pc= precioc*p3;
	const pd= preciod*p4;
	const pe= precioe*p5;
	const pf= preciof*p6;
	const pg= precioag*p7;

	const ref= pa+pb+pc+pd+pe+pf+pg;
	document.getElementById("res").textContent=`tu compra se realizo con exito el total a pagar es $${ref}`;
});
</script>
</body>
</html>
